# KnowledgeOps · 本地集成 stack（手动验证用）
# 用法：docker compose up -d
#
# Sprint 5 本地验收不强制启动 Docker；如需验证 Milvus / Langfuse / app
# 全量联调，可按 docs/delivery.md 手动运行并记录输出。

services:
  # =============== Vector DB ===============
  milvus:
    image: milvusdb/milvus:v2.4.10
    container_name: knowledge-ops-milvus
    command: ["milvus", "run", "standalone"]
    environment:
      - ETCD_USE_EMBED=true
      - ETCD_DATA_DIR=/var/lib/milvus/etcd
      - COMMON_STORAGETYPE=local
    volumes:
      - ./data/milvus:/var/lib/milvus
    ports:
      - "19530:19530"
      - "9091:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3

  # =============== LLMOps Observability ===============
  langfuse-postgres:
    image: postgres:16
    container_name: knowledge-ops-langfuse-db
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse_dev_password
      POSTGRES_DB: langfuse
    volumes:
      - ./data/langfuse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse"]
      interval: 10s

  langfuse:
    image: langfuse/langfuse:3
    container_name: knowledge-ops-langfuse
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse_dev_password@langfuse-postgres:5432/langfuse
      NEXTAUTH_SECRET: change-me-in-prod
      SALT: change-me-in-prod
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
    ports:
      - "3000:3000"

  # =============== App ===============
  app:
    build: .
    container_name: knowledge-ops-app
    depends_on:
      milvus:
        condition: service_healthy
      langfuse:
        condition: service_started
    environment:
      MILVUS_URI: http://milvus:19530
      LANGFUSE_HOST: http://langfuse:3000
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data/pdfs:/app/data/pdfs

# Future production hardening, not verified in Sprint 5 local smoke:
# - nginx reverse proxy + TLS
# - external sparse-search backend if rank-bm25 no longer satisfies scale needs
