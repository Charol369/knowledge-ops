[project]
name = "knowledge-ops"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4",
    "fastapi>=0.136.1",
    "grandalf>=0.8",
    "httpx>=0.28.1",
    "langchain>=1.3.1",
    "langchain-community>=0.4.1",
    "langchain-core>=1.4.0",
    "langchain-huggingface>=1.2.2",
    "langchain-milvus>=0.3.3",
    "langchain-openai>=1.2.1",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.6.1",
    "langsmith>=0.8.5",
    "mcp>=1.27.1",
    "milvus-lite>=3.0",
    "openai>=2.37.0",
    "pydantic-settings",
    "pymilvus[milvus-lite]>=2.6.14",
    "pypdf>=6.12.0",
    "python-docx",
    "python-dotenv>=1.2.2",
    "ragas",
    "rank-bm25",
    "redis",
    "sentence-transformers>=5.5.1",
    "streamlit>=1.57.0",
    "uvicorn[standard]>=0.47.0",
]

[dependency-groups]
dev = [
    "locust>=2.44.0",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.14",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
